name: iOS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_APP: /Applications/Xcode_26.3.app

jobs:
  controls-lint:
    name: Custom controls guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Blocking: every screen is on the design system and the allowlist is empty, so any stock
    # SwiftUI control outside Thorbis/Sources/DesignSystem now fails the build.
    steps:
      - uses: actions/checkout@v4
      - name: Guard against stock SwiftUI controls
        run: ./scripts/lint-stock-controls.sh
      - name: Check the UI test shards cover every class once
        run: python3 scripts/ui_test_shards.py --shards 6 --check
      - name: Test the guard and the shard planner
        run: python3 -m unittest scripts.tests.test_stock_control_guard scripts.tests.test_ui_test_shards
      - name: Check every text colour against the grounds it sits on
        run: python3 scripts/tests/contrast.py

  # One job used to build, run 1,500 unit tests and then 450 UI tests in a row. The UI tests
  # alone need more than two hours on one runner, so that job hit its time limit on every run
  # and never reported. Now the app is built once here and the unit tests run here; the UI
  # tests run from the same build in the `ui` shards below.
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Restore Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: swift-packages-${{ hashFiles('project.yml') }}
      - name: Build the app and both test bundles
        # Signed to run locally (ad hoc, no team or profile): an unsigned test host has no keychain
        # access in the simulator (errSecMissingEntitlement, -34018), and the price book's denial
        # marker lives in the keychain.
        run: |
          simulator_id=$(scripts/ci-simulator-id.sh)
          xcodebuild -project Thorbis.xcodeproj -scheme Thorbis \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath "${{ runner.temp }}/ThorbisDerivedData" \
            -clonedSourcePackagesDirPath "${{ runner.temp }}/SourcePackages" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= build-for-testing
      - name: Unit tests
        run: |
          simulator_id=$(scripts/ci-simulator-id.sh)
          xcodebuild -project Thorbis.xcodeproj -scheme Thorbis \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath "${{ runner.temp }}/ThorbisDerivedData" \
            -clonedSourcePackagesDirPath "${{ runner.temp }}/SourcePackages" \
            -resultBundlePath "${{ runner.temp }}/ThorbisUnitTests.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:ThorbisTests test-without-building
      - name: Save unit test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unit-test-results
          path: ${{ runner.temp }}/ThorbisUnitTests.xcresult
          if-no-files-found: ignore
          retention-days: 14
      - name: Pack the build for the UI test shards
        # tar keeps the bundles' symlinks, executable bits and ad hoc signatures intact.
        run: tar -C "${{ runner.temp }}/ThorbisDerivedData/Build" -cf "${{ runner.temp }}/ThorbisTestBuild.tar" Products
      - name: Hand the build to the UI test shards
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-build
          path: ${{ runner.temp }}/ThorbisTestBuild.tar
          if-no-files-found: error
          retention-days: 1

  ui:
    name: UI tests (${{ matrix.shard }} of ${{ strategy.job-total }})
    needs: build
    runs-on: macos-15
    # Shards are balanced by test count, not time; the first run's slowest shards passed an hour.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # The split is by class and balanced by test count: scripts/ui_test_shards.py --list.
        # Changing the number of entries here is the only edit needed to re-split, apart from
        # the `--check` step in controls-lint.
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
      - name: Fetch the build
        uses: actions/download-artifact@v4
        with:
          name: ios-test-build
          path: ${{ runner.temp }}
      - name: Unpack the build and warm the simulator
        # xcodebuild used to boot the simulator cold and install the app as the first test began.
        # Three failures landed in a shard's first two minutes that way: a first launch that timed
        # out in Xcode, and two taps the app received and never acted on while the system was still
        # starting services and rendering the app's widgets (BYR-1835). This step does that work
        # before any test: boot, install the app once, then wait (at most about three minutes)
        # until half the machine's CPU is idle. The load average is no use for this: on these
        # three-core runners it reads near 200 for minutes after a simulator boots.
        run: |
          mkdir -p "${{ runner.temp }}/ThorbisBuild"
          tar -C "${{ runner.temp }}/ThorbisBuild" -xf "${{ runner.temp }}/ThorbisTestBuild.tar"
          simulator_id=$(scripts/ci-simulator-id.sh)
          xcrun simctl bootstatus "$simulator_id" -b
          app=$(find "${{ runner.temp }}/ThorbisBuild/Products" -maxdepth 2 -name 'Thorbis.app' | head -n 1)
          if [[ -n "$app" ]]; then
            xcrun simctl install "$simulator_id" "$app" || echo "::warning::The app could not be installed ahead of the tests"
          else
            echo "::warning::The build carries no Thorbis.app to install ahead of the tests"
          fi
          idle=0
          for _ in $(seq 1 30); do
            # The second sample is the current one; the first covers the time since boot.
            idle=$({ top -l 2 -n 0 2>/dev/null || true; } | awk '/CPU usage/ { value = $7 } END { sub("%", "", value); print value + 0 }')
            if awk -v idle="$idle" 'BEGIN { exit !(idle >= 50) }'; then break; fi
            sleep 4
          done
          echo "CPU idle before the first test: ${idle}% (load $(sysctl -n vm.loadavg))"
      - name: Run this shard's UI tests
        run: |
          test_run=$(find "${{ runner.temp }}/ThorbisBuild/Products" -maxdepth 1 -name '*.xctestrun' | head -n 1)
          [[ -n "$test_run" ]] || { echo "The build carries no .xctestrun file" >&2; exit 1; }
          only_testing=$(python3 scripts/ui_test_shards.py --shards ${{ strategy.job-total }} --index ${{ matrix.shard }})
          simulator_id=$(scripts/ci-simulator-id.sh)
          # $only_testing is a list of -only-testing: arguments and must split on spaces.
          # shellcheck disable=SC2086
          xcodebuild -xctestrun "$test_run" \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -resultBundlePath "${{ runner.temp }}/ThorbisUITests-${{ matrix.shard }}.xcresult" \
            -parallel-testing-enabled NO \
            $only_testing test-without-building
      - name: Save UI test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-test-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/ThorbisUITests-${{ matrix.shard }}.xcresult
          if-no-files-found: ignore
          retention-days: 14

  # One check to require instead of six: green only when every shard passed.
  ui-tests:
    name: UI tests
    if: always()
    needs: ui
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every UI test shard passed
        run: |
          [[ "${{ needs.ui.result }}" == "success" ]] || { echo "UI test shards: ${{ needs.ui.result }}" >&2; exit 1; }
