name: iOS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controls-lint:
    name: Custom controls guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Blocking: every screen is on the design system and the allowlist is empty, so any stock
    # SwiftUI control outside Thorbis/Sources/DesignSystem now fails the build.
    steps:
      - uses: actions/checkout@v4
      - name: Guard against stock SwiftUI controls
        run: ./scripts/lint-stock-controls.sh

  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test on an iPhone simulator
        # Signed to run locally (ad hoc, no team or profile): an unsigned test host has no keychain
        # access in the simulator (errSecMissingEntitlement, -34018), and the price book's denial
        # marker lives in the keychain.
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for key,values in sorted(d["devices"].items(), reverse=True) if "iOS" in key for v in values if v["name"].startswith("iPhone")))')
          xcodebuild -project Thorbis.xcodeproj -scheme Thorbis \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath "${{ runner.temp }}/ThorbisDerivedData" \
            -resultBundlePath "${{ runner.temp }}/ThorbisTests.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:ThorbisUITests/JobEstimateHandoffUITests/testOverviewLoadsBothVerifiedPricesBeforeSelection \
            -only-testing:ThorbisUITests/JobEstimateHandoffUITests/testCustomerCanBrowseJobEstimatesUsingAccessibleControls \
            -only-testing:ThorbisUITests/JobEstimateHandoffUITests/testCustomerSwipesBetweenJobEstimateDetailsWithoutChangingSelection \
            -only-testing:ThorbisUITests/JobEstimateHandoffUITests/testTwoSameTitleEstimatesApproveIndependentlyInOneProtectedHandoff \
            -only-testing:ThorbisUITests/JobEstimateHandoffUITests/testApprovedOverviewShowsMatchingVerifiedReceipt \
            -only-testing:ThorbisUITests/JobEstimateHandoffUITests/testUnverifiedSentAmountIsHiddenAndCannotAdvanceReview \
            -only-testing:ThorbisUITests/JobEstimateHandoffUITests/testFailedRefreshShowsUnavailablePriceThenRecovers \
            -only-testing:ThorbisUITests/JobEstimateHandoffUITests/testLoadingNextPageReusesVerifiedPrices \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= test
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/ThorbisTests.xcresult
          if-no-files-found: ignore
