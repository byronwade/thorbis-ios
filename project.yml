name: Thorbis
options:
  bundleIdPrefix: com.thorbis
  deploymentTarget:
    iOS: "18.0"
packages:
  StripeTerminal:
    url: https://github.com/stripe/stripe-terminal-ios
    majorVersion: 5.8.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "17"
targets:
  Thorbis:
    type: application
    platform: iOS
    sources:
      - Thorbis/Sources
      - Shared
      - path: Thorbis/Resources/Fonts
      - path: Thorbis/Resources/Assets.xcassets
      - path: Thorbis/Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thorbis.field
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Thorbis
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Thorbis listens only while you tap the mic to dictate a job note."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Thorbis turns what you say into job note text, on this iPhone when it can."
        INFOPLIST_FILE: Thorbis/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Thorbis/Resources/Thorbis.entitlements
        DEVELOPMENT_TEAM: T677262U5B
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ThorbisWidgets
      - package: StripeTerminal
  ThorbisWidgets:
    type: app-extension
    platform: iOS
    sources:
      - ThorbisWidgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thorbis.field.widgets
        INFOPLIST_FILE: ThorbisWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: ThorbisWidgets/ThorbisWidgets.entitlements
        DEVELOPMENT_TEAM: T677262U5B
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        # Shared intents compile here only to draw buttons; they perform in the app process.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) THORBIS_WIDGET_EXTENSION
  ThorbisTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ThorbisTests
      # Compiled here too so tests can check and render the widget views.
      - ThorbisWidgets/JobLiveActivityWidget.swift
      - ThorbisWidgets/TodayJobsWidget.swift
    dependencies:
      - target: Thorbis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thorbis.field.tests
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_TESTS
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  ThorbisUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ThorbisUITests]
    dependencies:
      - target: Thorbis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thorbis.field.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Thorbis
        CODE_SIGNING_ALLOWED: NO
schemes:
  Thorbis:
    build:
      targets:
        Thorbis: all
    test:
      targets:
        - ThorbisTests
        - ThorbisUITests
