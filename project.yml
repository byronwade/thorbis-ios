name: Thorbis
options:
  bundleIdPrefix: com.thorbis
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"
targets:
  Thorbis:
    type: application
    platform: iOS
    sources:
      - Thorbis/Sources
      - path: Thorbis/Resources/Fonts
      - path: Thorbis/Resources/Assets.xcassets
      - path: Thorbis/Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thorbis.field
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Thorbis
        INFOPLIST_FILE: Thorbis/Resources/Info.plist
        DEVELOPMENT_TEAM: T677262U5B
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ThorbisTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ThorbisTests]
    dependencies:
      - target: Thorbis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thorbis.field.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
