name: Thorbis
options:
  bundleIdPrefix: com.thorbis
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Thorbis:
    type: application
    platform: iOS
    sources: [Thorbis/Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thorbis.field
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Thorbis
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_FILE: Thorbis/Resources/Info.plist
        CODE_SIGNING_ALLOWED: NO
